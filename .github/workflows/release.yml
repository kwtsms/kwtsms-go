name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'

      # 2026-11-05 14:18 +03: Version is sent in the User-Agent, so it must equal the tag (#939).
      - name: Check Version matches the tag
        run: |
          v=$(grep -oE '^const Version = "[^"]+"' kwtsms.go | cut -d'"' -f2)
          [ "v$v" = "${GITHUB_REF_NAME}" ] || { echo "::error::Version ($v) does not match tag ${GITHUB_REF_NAME}"; exit 1; }

      - name: Generate release notes from CHANGELOG
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#v}"
          awk "/^## \\[${VERSION}\\]/{found=1; next} /^## \\[/{if(found) exit} found" CHANGELOG.md > release-notes.md

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md

      - name: Warm Go module proxy
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          curl -sf "https://proxy.golang.org/github.com/kwtsms/kwtsms-go/@v/${TAG}.info" || true
          curl -sf "https://sum.golang.org/lookup/github.com/kwtsms/kwtsms-go@${TAG}" || true
